<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connect 4</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div id="intro-screen">
        <h1 class="title">Connect4</h1>
        <p class="intro-text">
            Welcome to the game Connect4, a classic two-player strategy game where players compete to be the first to align four of their colored discs in a row. First released by Hasbro in 1974, it is widely considered an advanced, vertical variation of Tic-Tac-Toe
        </p>
        <div class="mode-selector" id="mode-selector">
            <button class="mode-btn selected" data-mode="hh">Human vs Human</button>
            <button class="mode-btn" data-mode="hc">Human vs Computer</button>
            <button class="mode-btn" data-mode="ch">Computer vs Human</button>
            <button class="mode-btn" data-mode="cc">Computer vs Computer</button>
        </div>
        <button id="start-btn" class="start-btn">Start</button>
    </div>

    <div id="mode-badge" class="mode-badge hidden" data-mode="hh">Human vs Human</div>

    <div class="game-container hidden" id="game-container">
        <!-- The dynamic pieces container (Middle Layer) -->
        <div id="pieces-layer"></div>

        <!-- The foreground grid image with transparent holes (Top Layer) -->
        <!-- Replace 'connect4-grid.svg' with your actual transparent grid asset -->
        <img src="connect4-grid.svg" class="board-foreground" alt="Connect 4 Grid">
    </div>

    <div class="game-actions hidden" id="game-actions">
        <button id="back-btn" class="back-btn">Back</button>
        <button id="reset-btn" class="reset-btn">Reset</button>
    </div>

    <script src="js/game.js"></script>
</body>
</html>
